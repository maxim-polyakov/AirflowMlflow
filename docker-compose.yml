x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  environment: &airflow-environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DATABASE_URL}
    AIRFLOW__WEBSERVER__BASE_URL: https://${AIRFLOW_DOMAIN}
    AIRFLOW__WEBSERVER__ENABLE_PROXY_FIX: "true"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW_UID: ${AIRFLOW_UID:-50000}
    AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
    AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    AWS_DEFAULT_REGION: ${S3_REGION}
    S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
    DATA_BUCKET: ${DATA_BUCKET}
    DATA_OBJECT_KEY: ${DATA_OBJECT_KEY}
    KAFKA_LOGS_BUCKET: ${KAFKA_LOGS_BUCKET}
    KAFKA_LOGS_PREFIX: ${KAFKA_LOGS_PREFIX}
    KAFKA_LOGS_MAX_FILES_PER_RUN: ${KAFKA_LOGS_MAX_FILES_PER_RUN:-100}
    VAST_SSH_HOST: ${VAST_SSH_HOST:-}
    VAST_SSH_PORT: ${VAST_SSH_PORT:-22}
    VAST_SSH_USER: ${VAST_SSH_USER:-root}
    VAST_SSH_KEY_PATH: /opt/airflow/keys/vast_ai
    VAST_SSH_STRICT_HOST_KEY: ${VAST_SSH_STRICT_HOST_KEY:-false}
    VAST_LOGS_PATH: ${VAST_LOGS_PATH:-/workspace/data/kafka-logs}
    AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER}
    AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL}
    MLFLOW_TRACKING_URI: http://mlflow:5000
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./data:/opt/airflow/data
    - ./keys:/opt/airflow/keys:ro
  user: "${AIRFLOW_UID:-50000}:0"
  restart: unless-stopped

services:
  airflow-init:
    <<: *airflow-common
    user: "0:0"
    entrypoint: /bin/bash
    restart: "no"
    command:
      - -ec
      - |
        mkdir -p /opt/airflow/logs /opt/airflow/data
        chown -R "$${AIRFLOW_UID}:0" /opt/airflow/logs /opt/airflow/data
        exec /entrypoint bash -ec '
          airflow db migrate
          airflow users create \
            --username "$${AIRFLOW_ADMIN_USER}" \
            --password "$${AIRFLOW_ADMIN_PASSWORD}" \
            --firstname Admin \
            --lastname User \
            --role Admin \
            --email "$${AIRFLOW_ADMIN_EMAIL}" \
          || airflow users list
        '

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    environment:
      MLFLOW_BACKEND_STORE_URI: ${MLFLOW_DATABASE_URL}
      MLFLOW_ARTIFACT_BUCKET: ${MLFLOW_ARTIFACT_BUCKET}
      MLFLOW_ARTIFACT_PREFIX: ${MLFLOW_ARTIFACT_PREFIX}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: ${S3_REGION}
      MLFLOW_S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
    command:
      - sh
      - -ec
      - |
        mlflow server \
          --host 0.0.0.0 \
          --port 5000 \
          --backend-store-uri "$${MLFLOW_BACKEND_STORE_URI}" \
          --serve-artifacts \
          --artifacts-destination "s3://${MLFLOW_ARTIFACT_BUCKET}/${MLFLOW_ARTIFACT_PREFIX}"
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  stormmodel:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    container_name: stormmodel
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_NAME: ${MODEL_NAME}
      MODEL_ALIAS: ${MODEL_ALIAS:-production}
      MODEL_SERVING_PORT: "8000"
      MODEL_POLL_SECONDS: ${MODEL_POLL_SECONDS:-60}
    command: ["/bin/sh", "/app/model-serving-entrypoint.sh"]
    volumes:
      - ./scripts/model-serving-entrypoint.sh:/app/model-serving-entrypoint.sh:ro
      - model-environments:/root/.mlflow
    ports:
      - "127.0.0.1:${MODEL_PORT:-8000}:8000"
    depends_on:
      mlflow:
        condition: service_healthy
    restart: unless-stopped

volumes:
  model-environments:

